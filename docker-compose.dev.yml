services:
  n8n:
    image: n8nio/n8n:latest
    container_name: repo-manager-n8n
    ports:
      - '5678:5678'
    volumes:
      - n8n_data:/home/node/.n8n
      - ./.github/workflows/n8n:/home/node/.n8n/workflows
    environment:
      # Use ngrok URL for public-facing webhooks
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${WEBHOOK_URL}
      - NODE_ENV=development
      # Add any environment variables needed for GitHub API
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY}

  ngrok:
    image: ngrok/ngrok:latest
    container_name: repo-manager-ngrok
    ports:
      - '4040:4040'
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http n8n:5678
    depends_on:
      - n8n

volumes:
  n8n_data:
